<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="404 — the page you're looking for couldn't be found. Head back to the Voltix Repair Lab homepage.">
  <title>404 — Page Not Found | Voltix</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var dir = localStorage.getItem('dir');
        if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="404">

  <div id="preloader" aria-hidden="true">
    <svg class="preloader-bolt" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="#a0113d">
      <path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2Z"/>
    </svg>
  </div>

  <div id="navbar"></div>

  <main>
    <section class="center-page">
      <div class="ambient-bg" aria-hidden="true">
        <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
      </div>
      <div class="container reveal in">
        <div class="big-404">404</div>
        <h1 class="h3 mt-3 mb-2">This circuit is shorted out</h1>
        <p class="text-muted mx-auto mb-4" style="max-width:460px">The page you're looking for doesn't exist or has been moved. Let's get you back to a working state.</p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
          <a class="btn btn-accent btn-lg" href="index.html"><i class="fa-solid fa-house"></i> Back to Home</a>
          <a class="btn btn-ghost btn-lg" href="contact.html"><i class="fa-solid fa-envelope"></i> Contact Support</a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <button id="backTop" class="back-top" type="button" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
