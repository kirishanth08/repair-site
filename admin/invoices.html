<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Voltix Repair Lab admin invoices — browse every invoice, filter and print a copy.">
  <meta name="robots" content="noindex">
  <title>Invoices — Voltix Repair Lab</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var dir = localStorage.getItem('dir');
        if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('vx_session'));
        if (!s || !s.email || s.role !== 'admin') window.location.replace('login.html');
      } catch (e) { window.location.replace('login.html'); }
    })();
  </script>
</head>
<body data-page="admin" data-admin="invoices">

  <div class="ambient-bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span>
    <span class="orb o3"></span><span class="orb o4"></span>
    <span class="orb o5"></span>
    <span class="bokeh b1"></span><span class="bokeh b2"></span><span class="bokeh b3"></span>
  </div>

  <div class="admin-body">
    <div id="adminSide"></div>
    <div class="admin-backdrop"></div>

    <div class="admin-main">
      <header class="admin-top">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-icon side-toggle" id="sideOpen" type="button" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button>
          <div>
            <p class="text-muted mb-1 small" id="adGreeting">Good day, Admin</p>
            <h1 class="t-title">Invoices</h1>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode"><span class="icon-sun"><i class="fa-solid fa-sun"></i></span><span class="icon-moon"><i class="fa-solid fa-moon"></i></span></button>
          <button class="rtl-toggle" type="button" data-rtl-toggle aria-label="Toggle text direction"><span data-rtl-label>RTL</span></button>
          <a class="btn btn-icon position-relative" href="messages.html" aria-label="Messages"><i class="fa-solid fa-bell"></i><span class="badge-soft position-absolute top-0 start-100 translate-middle" id="adBell">0</span></a>
          <a class="btn btn-ghost" href="jobs.html"><i class="fa-solid fa-screwdriver-wrench"></i> Manage Jobs</a>
        </div>
      </header>

      <div class="container px-0">
        <section class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="card-neu kpi-card">
              <span class="icon-box" style="color:var(--teal)"><i class="fa-solid fa-check-double"></i></span>
              <div>
                <span>Paid (completed)</span>
                <b id="inPaid">$0</b>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card-neu kpi-card">
              <span class="icon-box" style="color:var(--gold)"><i class="fa-solid fa-hourglass-half"></i></span>
              <div>
                <span>Pending (active)</span>
                <b id="inPending">$0</b>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card-neu kpi-card">
              <span class="icon-box" style="color:var(--accent)"><i class="fa-solid fa-file-invoice-dollar"></i></span>
              <div>
                <span>Invoice type</span>
                <b>Itemized</b>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card-neu kpi-card">
              <span class="icon-box" style="color:var(--accent-2)"><i class="fa-solid fa-shield-halved"></i></span>
              <div>
                <span>Warranty</span>
                <b>90 days</b>
              </div>
            </div>
          </div>
        </section>

        <section class="card-neu p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h2 class="h5 mb-0">All invoices</h2>
            <div class="d-flex flex-wrap gap-2">
              <input class="field" id="in-search" type="search" placeholder="Search invoice, customer…" aria-label="Search invoices" style="max-width:240px">
              <select class="field" id="in-status" aria-label="Filter by status" style="max-width:170px">
                <option value="all">All invoices</option>
                <option value="active">Pending</option>
                <option value="completed">Paid</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-gh align-middle mb-0">
              <thead>
                <tr><th>Invoice</th><th>Customer</th><th>Device</th><th>Date</th><th>Status</th><th>Amount</th><th class="text-end">View</th></tr>
              </thead>
              <tbody id="invBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="adminModal"></div>

  <button id="backTop" class="back-top" type="button" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
