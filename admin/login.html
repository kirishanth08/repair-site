<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the Voltix Repair Lab admin area to manage repairs, jobs and analytics.">
  <meta name="robots" content="noindex">
  <title>Admin Sign In — Voltix Repair Lab</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var dir = localStorage.getItem('dir');
        if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="login">

  <div id="preloader" aria-hidden="true">
    <svg class="preloader-bolt" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="#a0113d">
      <path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2Z"/>
    </svg>
  </div>

  <div id="navbar"></div>

  <main>
    <section class="auth-wrap circuit-bg">
      <div class="ambient-bg" aria-hidden="true">
        <span class="orb o1"></span><span class="orb o2"></span>
        <span class="orb o3"></span>
      </div>
      <div class="container">
        <div class="auth-card card-neu neu-lg reveal in">
          <div class="auth-brand">
            <a class="brand" href="../index.html" aria-label="Voltix - Home">
              <span class="brand-logo"><i class="fa-solid fa-bolt"></i></span>
              <span><span class="brand-name">Voltix</span><span class="brand-tag">Repair Lab · Admin</span></span>
            </a>
          </div>
          <h2>Admin sign in</h2>
          <p class="auth-sub">Sign in to manage repairs, jobs and analytics.</p>

          <div id="authMsg" class="alert d-none" role="alert"></div>

          <form data-auth-form="login" novalidate>
            <input type="hidden" id="redirectTo" value="dashboard.html">
            <input type="hidden" name="role" value="admin">
            <div class="mb-3">
              <label class="form-label" for="lg-email">Email address</label>
              <div class="field-wrap">
                <i class="field-icon fa-solid fa-envelope"></i>
                <input class="field" id="lg-email" type="email" placeholder="admin@voltix.com" autocomplete="email" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="passwordField">Password</label>
              <div class="position-relative">
                <i class="field-icon fa-solid fa-lock"></i>
                <input class="field" id="passwordField" type="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show or hide password"><i class="fa-solid fa-eye"></i></button>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <label class="check-label mb-0"><input type="checkbox" checked> Remember me</label>
              <a href="#" class="small fw-bold">Forgot password?</a>
            </div>
            <button class="btn btn-accent btn-lg btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
          </form>

          <p class="auth-alt">New to the admin area? <a href="register.html" class="fw-bold">Create admin account</a></p>
          <p class="auth-alt">Customer? <a href="../login.html" class="fw-bold">Customer sign in</a></p>
        </div>
      </div>
    </section>
  </main>

  <button id="backTop" class="back-top" type="button" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
