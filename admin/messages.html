<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Voltix Repair Lab admin messages — inbox for customer enquiries with replies.">
  <meta name="robots" content="noindex">
  <title>Messages — Voltix Repair Lab</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var dir = localStorage.getItem('dir');
        if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('vx_session'));
        if (!s || !s.email || s.role !== 'admin') window.location.replace('login.html');
      } catch (e) { window.location.replace('login.html'); }
    })();
  </script>
</head>
<body data-page="admin" data-admin="messages">

  <div class="ambient-bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span>
    <span class="orb o3"></span><span class="orb o4"></span>
    <span class="orb o5"></span>
    <span class="bokeh b1"></span><span class="bokeh b2"></span><span class="bokeh b3"></span>
  </div>

  <div class="admin-body">
    <div id="adminSide"></div>
    <div class="admin-backdrop"></div>

    <div class="admin-main">
      <header class="admin-top">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-icon side-toggle" id="sideOpen" type="button" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button>
          <div>
            <p class="text-muted mb-1 small" id="adGreeting">Good day, Admin</p>
            <h1 class="t-title">Messages</h1>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode"><span class="icon-sun"><i class="fa-solid fa-sun"></i></span><span class="icon-moon"><i class="fa-solid fa-moon"></i></span></button>
          <button class="rtl-toggle" type="button" data-rtl-toggle aria-label="Toggle text direction"><span data-rtl-label>RTL</span></button>
          <a class="btn btn-icon position-relative" href="messages.html" aria-label="Messages"><i class="fa-solid fa-bell"></i><span class="badge-soft position-absolute top-0 start-100 translate-middle" id="adBell">0</span></a>
          <button class="btn btn-accent" type="button" id="markAllRead"><i class="fa-solid fa-check-double"></i> Mark all read</button>
        </div>
      </header>

      <div class="container px-0">
        <section class="card-neu p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h2 class="h5 mb-0">Inbox</h2>
            <input class="field" id="ms-search" type="search" placeholder="Search messages…" aria-label="Search messages" style="max-width:280px">
          </div>
          <div id="msgList"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="adminModal"></div>

  <div class="modal fade" id="replyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-reply me-2" style="color:var(--accent)"></i>Reply to message</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1"><b style="color:var(--heading)">From:</b> <span id="msgFrom">—</span> <small class="text-muted" id="msgEmail">—</small></p>
          <p class="mb-3"><b style="color:var(--heading)">Subject:</b> <span id="msgSubject">—</span></p>
          <div class="neu-inset p-3 mb-3" style="border-radius:var(--r-md)">
            <p class="small text-muted mb-0" id="msgBody">—</p>
          </div>
          <form id="sendReplyForm" novalidate>
            <label class="form-label" for="msgReply">Your reply</label>
            <textarea class="field mb-3" id="msgReply" rows="4" placeholder="Write your reply…" required></textarea>
            <p class="small text-teal d-none" id="replySent"><i class="fa-solid fa-circle-check me-1"></i>Reply sent successfully.</p>
            <div class="d-flex gap-2 justify-content-end flex-wrap">
              <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-accent"><i class="fa-solid fa-paper-plane"></i> Send reply</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <button id="backTop" class="back-top" type="button" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
