<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Voltix Repair Lab admin jobs — manage repair jobs, update statuses and invoices.">
  <meta name="robots" content="noindex">
  <title>Jobs — Voltix Repair Lab</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var dir = localStorage.getItem('dir');
        if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('vx_session'));
        if (!s || !s.email || s.role !== 'admin') window.location.replace('login.html');
      } catch (e) { window.location.replace('login.html'); }
    })();
  </script>
</head>
<body data-page="admin" data-admin="jobs">

  <div class="ambient-bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span>
    <span class="orb o3"></span><span class="orb o4"></span>
    <span class="orb o5"></span>
    <span class="bokeh b1"></span><span class="bokeh b2"></span><span class="bokeh b3"></span>
  </div>

  <div class="admin-body">
    <div id="adminSide"></div>
    <div class="admin-backdrop"></div>

    <div class="admin-main">
      <header class="admin-top">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-icon side-toggle" id="sideOpen" type="button" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button>
          <div>
            <p class="text-muted mb-1 small" id="adGreeting">Good day, Admin</p>
            <h1 class="t-title">Jobs</h1>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode"><span class="icon-sun"><i class="fa-solid fa-sun"></i></span><span class="icon-moon"><i class="fa-solid fa-moon"></i></span></button>
          <button class="rtl-toggle" type="button" data-rtl-toggle aria-label="Toggle text direction"><span data-rtl-label>RTL</span></button>
          <a class="btn btn-icon position-relative" href="messages.html" aria-label="Messages"><i class="fa-solid fa-bell"></i><span class="badge-soft position-absolute top-0 start-100 translate-middle" id="adBell">0</span></a>
          <button class="btn btn-accent" type="button" data-bs-toggle="modal" data-bs-target="#newJobModal"><i class="fa-solid fa-plus"></i> New Job</button>
        </div>
      </header>

      <div class="container px-0">
        <section class="card-neu p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h2 class="h5 mb-0">All repair jobs</h2>
            <div class="d-flex flex-wrap gap-2">
              <input class="field" id="jb-search" type="search" placeholder="Search jobs, customers, devices…" aria-label="Search jobs" style="max-width:260px">
              <select class="field" id="jb-status" aria-label="Filter by status" style="max-width:190px">
                <option value="all">All statuses</option>
                <option value="active">Active</option>
                <option value="0">Received</option>
                <option value="1">Diagnosis</option>
                <option value="2">Under Repair</option>
                <option value="3">Quality Check</option>
                <option value="4">Ready for Pickup</option>
                <option value="5">Completed</option>
              </select>
              <select class="field" id="jb-device" aria-label="Filter by device" style="max-width:190px">
                <option value="all">All devices</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-gh align-middle mb-0">
              <thead>
                <tr><th>Job ID</th><th>Customer</th><th>Device</th><th>Issue</th><th>Status</th><th>Amount</th><th class="text-end">Actions</th></tr>
              </thead>
              <tbody id="jobsBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="adminModal"></div>

  <div class="modal fade" id="newJobModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-plus me-2" style="color:var(--accent)"></i>New repair job</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="newJobForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="nf-customer">Customer name</label>
                <input class="field" id="nf-customer" type="text" placeholder="e.g. Emma Lewis" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="nf-device">Device type</label>
                <select class="field" id="nf-device" aria-label="Device type">
                  <option value="" disabled selected>Select device type…</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="nf-brand">Brand</label>
                <input class="field" id="nf-brand" type="text" placeholder="e.g. Apple, Samsung" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="nf-model">Model</label>
                <input class="field" id="nf-model" type="text" placeholder="e.g. iPhone 14" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="nf-issue">Issue</label>
                <select class="field" id="nf-issue" required>
                  <option value="" disabled selected>Select an issue…</option>
                  <option value="screen">Cracked screen</option>
                  <option value="battery">Battery problem</option>
                  <option value="charging">Not charging</option>
                  <option value="motherboard">Won't turn on</option>
                  <option value="water">Water damage</option>
                  <option value="camera">Camera issue</option>
                  <option value="software">Software / virus</option>
                  <option value="general">Something else</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="nf-cost">Repair cost ($)</label>
                <input class="field" id="nf-cost" type="number" min="0" step="1" placeholder="e.g. 89" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="nf-desc">Problem description</label>
                <textarea class="field" id="nf-desc" rows="3" placeholder="What happened? When did it start?"></textarea>
              </div>
              <div class="col-12 d-flex gap-2 justify-content-end flex-wrap">
                <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-accent"><i class="fa-solid fa-paper-plane"></i> Create job</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <button id="backTop" class="back-top" type="button" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
