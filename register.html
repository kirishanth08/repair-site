<!doctype html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a Voltix Repair Lab account to track repairs, download invoices and request new repairs online.">
  <title>Sign Up — Voltix Repair Lab</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        var dir = localStorage.getItem('dir');
        if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="register">

  <div id="preloader" aria-hidden="true">
    <svg class="preloader-bolt" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="#a0113d">
      <path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2Z"/>
    </svg>
  </div>

  <div id="navbar"></div>

  <main>
    <section class="auth-wrap circuit-bg">
      <div class="ambient-bg" aria-hidden="true">
        <span class="orb o1"></span><span class="orb o2"></span>
        <span class="orb o3"></span>
      </div>
      <div class="container">
        <div class="auth-card card-neu neu-lg reveal in">
          <div class="auth-brand">
            <a class="brand" href="index.html" aria-label="Voltix - Home">
              <span class="brand-logo"><i class="fa-solid fa-bolt"></i></span>
              <span><span class="brand-name">Voltix</span><span class="brand-tag">Repair Lab</span></span>
            </a>
          </div>
          <h2>Create your account</h2>
          <p class="auth-sub">Track repairs, download invoices and book online.</p>

          <div id="authMsg" class="alert d-none" role="alert"></div>

          <form data-auth-form="register" novalidate>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label" for="rg-fname">First name</label>
                <input class="field" id="rg-fname" type="text" placeholder="Alex" autocomplete="given-name" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="rg-lname">Last name</label>
                <input class="field" id="rg-lname" type="text" placeholder="Morgan" autocomplete="family-name" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="rg-email">Email address</label>
                <div class="field-wrap">
                  <i class="field-icon fa-solid fa-envelope"></i>
                  <input class="field" id="rg-email" type="email" placeholder="you@email.com" autocomplete="email" required>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="rg-phone">Phone <span class="text-muted fw-normal">(optional)</span></label>
                <div class="field-wrap">
                  <i class="field-icon fa-solid fa-phone"></i>
                  <input class="field" id="rg-phone" type="tel" placeholder="(555) 000-0000" autocomplete="tel">
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="registerPassword">Password</label>
                <div class="position-relative">
                  <i class="field-icon fa-solid fa-lock"></i>
                  <input class="field" id="registerPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
                  <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show or hide password"><i class="fa-solid fa-eye"></i></button>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="registerConfirm">Confirm password</label>
                <div class="position-relative">
                  <i class="field-icon fa-solid fa-lock"></i>
                  <input class="field" id="registerConfirm" type="password" placeholder="Repeat your password" autocomplete="new-password" required>
                  <button type="button" class="pw-toggle" aria-label="Show or hide password"><i class="fa-solid fa-eye"></i></button>
                </div>
              </div>
              <div class="col-12">
                <label class="check-label">
                  <input type="checkbox" required>
                  <span>I agree to the <a href="#" data-legal="terms">Terms of Service</a> and <a href="#" data-legal="privacy">Privacy Policy</a>.</span>
                </label>
              </div>
              <div class="col-12">
                <button class="btn btn-accent btn-lg btn-block" type="submit"><i class="fa-solid fa-user-plus"></i> Create Account</button>
              </div>
            </div>
          </form>

          <p class="auth-alt">Already have an account? <a href="login.html" class="fw-bold">Sign in</a></p>
        </div>
      </div>
    </section>
  </main>

  <button id="backTop" class="back-top" type="button" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
